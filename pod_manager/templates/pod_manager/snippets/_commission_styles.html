{% comment %}
Shared styles for the public commission pages (queue, request form, request
page). All of it sits on .cq-panel, a surface: surface tokens only.
{% endcomment %}
<style>
    .cq-wrap { max-width: 60rem; margin: 0 auto; padding-bottom: 3rem; }

    /* One surface panel behind the whole body, so text never sits on the raw
       page background. Inside it: surface tokens only, never --vecto-bg-*.
       Chips, rows and the toggle use an inset shade nudged toward the surface
       text colour, which reads on dark and light themes alike. */
    .cq-panel {
        --cq-inset: color-mix(in srgb, var(--vecto-surface-text) 6%, var(--vecto-surface-bg));
        padding: 1.5rem 1.25rem 2rem;
        background: var(--vecto-surface-bg); color: var(--vecto-surface-text);
        border: 1px solid var(--bs-border-color); border-radius: var(--bs-border-radius);
    }
    @media (min-width: 768px) { .cq-panel { padding: 2rem 2.5rem 2.5rem; } }

    .cq-hero { padding-bottom: 0.5rem; text-align: center; }
    .cq-hero h1 { color: var(--vecto-surface-text); letter-spacing: -0.02em; }
    .cq-hero .cq-intro { color: var(--vecto-surface-muted); max-width: 44rem; margin: 0 auto; }
    .cq-hero .cq-intro a { color: var(--vecto-primary); }

    .cq-prices { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; margin-top: 1.5rem; }
    .cq-price {
        min-width: 11rem; padding: 0.85rem 1.25rem; text-align: center;
        background: var(--cq-inset);
        border: 1px solid var(--bs-border-color); border-top: 3px solid var(--vecto-primary);
        border-radius: var(--vecto-radius-md);
    }
    .cq-price-name { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--vecto-surface-muted); }
    .cq-price-amount { font-size: 1.75rem; font-weight: 800; line-height: 1.2; color: var(--vecto-primary); }
    .cq-price-desc { font-size: 0.8rem; color: var(--vecto-surface-muted); }
    .cq-hint { margin-top: 0.85rem; font-size: 0.875rem; color: var(--vecto-surface-muted); }

    .cq-section-title { display: flex; align-items: baseline; gap: 0.5rem; margin: 2rem 0 0.75rem; }
    .cq-section-title h2 { font-size: 1.35rem; font-weight: 700; margin: 0; }
    .cq-count { color: var(--vecto-surface-muted); font-size: 0.9rem; }

    .cq-list { list-style: none; padding: 0; margin: 0; }
    .cq-row {
        display: flex; align-items: center; gap: 1rem;
        padding: 0.85rem 1rem; margin-bottom: 0.5rem;
        background: var(--cq-inset);
        border: 1px solid var(--bs-border-color); border-radius: var(--vecto-radius-md);
    }
    .cq-num {
        flex: 0 0 2.25rem; height: 2.25rem; display: flex; align-items: center; justify-content: center;
        font-weight: 800; color: var(--vecto-primary-text); background: var(--vecto-primary);
        border-radius: var(--vecto-radius-sm);
    }
    .cq-main { flex-grow: 1; min-width: 0; }
    .cq-pick { font-weight: 700; overflow-wrap: anywhere; }
    .cq-meta { font-size: 0.8rem; color: var(--vecto-surface-muted); }
    .cq-meta a { color: var(--vecto-primary); }
    .cq-estimate { color: var(--vecto-primary); }
    .cq-status {
        flex-shrink: 0; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
        padding: 0.3em 0.65em; border-radius: var(--vecto-radius-sm); border: 1px solid var(--bs-border-color);
        color: var(--vecto-surface-muted);
    }
    .cq-status-scheduled { color: var(--vecto-primary); border-color: var(--vecto-primary); }
    .cq-status-watched { color: var(--vecto-success-text); background: var(--vecto-success); border-color: var(--vecto-success); }
    .cq-empty { padding: 2rem 1rem; text-align: center; color: var(--vecto-surface-muted); }

    .cq-released-toggle {
        width: 100%; display: flex; align-items: center; justify-content: space-between;
        padding: 0.85rem 1rem; font-weight: 700;
        background: var(--cq-inset); color: var(--vecto-surface-text);
        border: 1px solid var(--bs-border-color); border-radius: var(--vecto-radius-md);
    }
    .cq-released-toggle:hover { border-color: var(--vecto-primary); }
    .cq-released-toggle .bi { transition: transform 0.2s ease; }
    .cq-released-toggle[aria-expanded="true"] .bi { transform: rotate(180deg); }
    .cq-released .cq-row { padding: 0.65rem 1rem; }

    .cq-details { margin-top: 2.5rem; padding-top: 2rem; border-top: 1px solid var(--bs-border-color); }
    .cq-details h2, .cq-details h3 { font-weight: 700; margin-top: 1.25rem; }
    .cq-details > :first-child { margin-top: 0; }
    .cq-details > :last-child { margin-bottom: 0; }
    .cq-details a { color: var(--vecto-primary); }

    /* Forms and the request page (commission_request / commission_detail). */
    .cq-panel .form-control, .cq-panel .form-select { background: var(--cq-inset) !important; }
    .cq-panel .form-label { font-weight: 700; font-size: 0.875rem; }
    .cq-panel .form-text { color: var(--vecto-surface-muted); }
    .cq-signin {
        display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1rem;
        padding: 1rem 1.25rem; margin-bottom: 1.5rem;
        background: color-mix(in srgb, var(--vecto-primary) 10%, var(--vecto-surface-bg));
        border: 1px solid color-mix(in srgb, var(--vecto-primary) 45%, transparent);
        border-radius: var(--vecto-radius-md);
    }
    .cq-signin ul { margin: 0.25rem 0 0; padding-left: 1.1rem; color: var(--vecto-surface-muted); font-size: 0.875rem; }
    .cq-version {
        display: block; height: 100%; padding: 0.85rem 1rem; cursor: pointer;
        background: var(--cq-inset); border: 2px solid var(--bs-border-color); border-radius: var(--vecto-radius-md);
    }
    .cq-version:hover { border-color: color-mix(in srgb, var(--vecto-primary) 60%, transparent); }
    .btn-check:checked + .cq-version { border-color: var(--vecto-primary); box-shadow: 0 0 0 1px var(--vecto-primary); }
    .cq-version .cq-price-amount { font-size: 1.4rem; }
    .cq-terms { max-height: 12rem; overflow-y: auto; padding: 0.75rem 1rem; font-size: 0.875rem;
        background: var(--cq-inset); border: 1px solid var(--bs-border-color); border-radius: var(--vecto-radius-sm); }
    .cq-summary { width: 100%; }
    .cq-summary th { width: 9rem; padding: 0.4rem 1rem 0.4rem 0; color: var(--vecto-surface-muted); font-weight: 600; vertical-align: top; }
    .cq-summary td { padding: 0.4rem 0; overflow-wrap: anywhere; }
    .cq-status-pending { color: var(--vecto-primary); border-color: var(--vecto-primary); }
    .cq-status-removed, .cq-status-withdrawn, .cq-status-expired { text-decoration: line-through; }
    .cq-notice { padding: 0.85rem 1rem; margin-bottom: 1.25rem; border-radius: var(--vecto-radius-md);
        border: 1px solid var(--bs-border-color); background: var(--cq-inset); }
    .cq-notice-ok { border-color: var(--vecto-success); }
</style>
